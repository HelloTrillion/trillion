[project]
name = "trillion"
version = "0.0.1"
description = "The voice-first AI agent with a face."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jsonschema>=4.26.0",
    "keyring>=25",
    "mcp>=1.20",
    "pyyaml>=6.0",
    "tzdata>=2025.2; sys_platform == 'win32'",
    "uvicorn>=0.30",
    "websockets>=13",
]

# Local speech recognition (VOI-11b). Optional because it is large: the free way to
# be heard, for anyone who wants nothing to leave the machine.
[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]

[project.scripts]
trillion = "trillion.cli.main:entrypoint"

# Plugin discovery (CON-7). First-party tools register here too.
[project.entry-points."trillion.tools"]
file_list = "trillion.tools.files:FileList"
file_read = "trillion.tools.files:FileRead"
file_create = "trillion.tools.files:FileCreate"
file_overwrite = "trillion.tools.files:FileOverwrite"
file_append = "trillion.tools.files:FileAppend"
file_edit = "trillion.tools.files:FileEdit"
describe_self = "trillion.tools.describe:DescribeSelf"
memory_write = "trillion.tools.memory:MemoryWrite"
memory_recall = "trillion.tools.memory:MemoryRecall"
memory_forget = "trillion.tools.memory:MemoryForget"
rule_keep = "trillion.tools.rules:RuleKeep"
rule_drop = "trillion.tools.rules:RuleDrop"
decision_record = "trillion.tools.record:DecisionRecord"
web_fetch = "trillion.tools.web:WebFetch"
skill_open = "trillion.tools.skills:SkillOpen"
skill_file = "trillion.tools.skills:SkillFile"
reminder_set = "trillion.tools.schedule:ReminderSet"
ask_schedule = "trillion.tools.schedule:AskSchedule"
schedule_list = "trillion.tools.schedule:ScheduleList"
schedule_cancel = "trillion.tools.schedule:ScheduleCancel"
[project.entry-points."trillion.connectors"]
[project.entry-points."trillion.checkers"]
[project.entry-points."trillion.channels"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trillion"]
# A distribution's own Google app (connectors/google/config.py) ships in its wheel
# when the file is there at build time. It is git-ignored, so it never reaches the
# public repo: official builds write it from a CI secret before building.
# The built page goes in the same way (scripts/build_release.py copies it there).
artifacts = [
    "src/trillion/connectors/google/google_client.json",
    "src/trillion/api/static/**",
]

# The authored default soul ships inside the wheel: an installed user has no checkout.
[tool.hatch.build.targets.wheel.force-include]
"persona/SOUL.md" = "trillion/persona/default/SOUL.md"

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]
# ruff format touches fenced ```python blocks in Markdown by default; docs/
# belongs to other tracks and isn't Python source, so keep the tool out of it.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20", "LOG", "G", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["T20", "S603", "S607"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["trillion"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["trillion.spine.*", "trillion.storage.*", "trillion.tools.*", "trillion.voice.*", "trillion.brain.*", "trillion.persona.*", "trillion.api.*", "trillion.memory.*", "trillion.scheduler.*", "trillion.delivery.*", "trillion.workspace.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A test stuck this long prints where every thread is, so a hang in CI can be read.
faulthandler_timeout = 120

# Optional installs: typed as Any whether or not they are present.
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "numpy", "numpy.*"]
ignore_missing_imports = true
follow_untyped_imports = false
follow_imports = "skip"
