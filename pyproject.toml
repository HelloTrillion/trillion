[project]
name = "trillion"
version = "0.0.1"
description = "The voice-first AI agent with a face."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
trillion = "trillion.cli.main:entrypoint"

# Plugin discovery (CON-7). First-party tools register here too.
[project.entry-points."trillion.tools"]
[project.entry-points."trillion.connectors"]
[project.entry-points."trillion.checkers"]
[project.entry-points."trillion.channels"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trillion"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]
# ruff format touches fenced ```python blocks in Markdown by default; docs/
# belongs to other tracks and isn't Python source, so keep the tool out of it.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "T20", "LOG", "G", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/**" = ["T20", "S603", "S607"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["trillion"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["trillion.spine.*", "trillion.storage.*", "trillion.tools.*", "trillion.voice.*", "trillion.brain.*"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
