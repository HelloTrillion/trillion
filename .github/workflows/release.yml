name: Release

# The wheel testers and users install: the app, its page, and our Google app, so
# "Sign in with Google" works without anyone registering a Google app of their own.
#
# - Push a tag v<version> (matching pyproject.toml): builds, checks, and attaches the
#   wheel to a GitHub release (a pre-release while the version is 0.x).
# - Run it by hand (Actions → Release → Run workflow): builds and checks, and keeps
#   the wheel as a download on that run, with no release.
#
# Our Google app comes from the GOOGLE_CLIENT_JSON repository secret. Never on pull
# requests: this workflow has no pull_request trigger, so no fork can read it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel:
    name: Build the wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to create the release; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hellotrillion/web... build
      - run: uv sync --locked
      - name: Build and check the wheel
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: uv run python scripts/build_release.py --require-google ${TAG:+--tag "$TAG"}
      - name: Keep the wheel on this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trillion-wheel
          path: dist-release/*.whl
          if-no-files-found: error
          retention-days: 30
      - name: Attach it to a release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=""
          case "$TAG" in v0.*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist-release/*.whl $pre --generate-notes --title "Trillion $TAG"
