name: Dev build

# The dev channel: the newest build of main, as a wheel on one rolling GitHub
# pre-release tagged `dev`. Never on PyPI, never a desktop app.
#
# Every push to main builds the wheel exactly as a release does (the page and our
# Google app inside, checked), gives it the version of dev build N of what main
# says (scripts/version.py dev N: 2026.11.0 → 2026.11.1.devN), and replaces the
# wheel on the `dev` release. `install.sh --channel dev` and `trillion update` on
# the dev channel install from there.
#
# Only in this repository: a fork has no GOOGLE_CLIENT_JSON secret, and its dev
# builds are its own business. No pull request trigger, so no fork's code runs here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest build matters: a newer push cancels one still running.
  group: dev-build
  cancel-in-progress: true

jobs:
  dev:
    name: Build main for the dev channel
    if: github.repository == 'HelloTrillion/trillion'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # to replace the dev release; nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hellotrillion/web... build
      - run: uv sync --locked
      - name: Give it a dev version
        run: python3 scripts/version.py dev "$GITHUB_RUN_NUMBER"
      - name: Build and check the wheel
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        # --frozen: the version just changed in uv.lock too; nothing to resolve.
        run: uv run --frozen python scripts/build_release.py --require-google
      - name: Keep the wheel on this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trillion-dev-wheel
          path: dist-release/*.whl
          if-no-files-found: error
          retention-days: 7
      - name: Replace the wheel on the dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          wheel="$(ls dist-release/trillion-*.whl)"
          version="$(python3 scripts/version.py)"
          # The release and its tag are made again on this commit: the tag moves with
          # main, and the release holds only this build's wheel.
          gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          gh release create dev "$wheel" --prerelease --latest=false --target "$GITHUB_SHA" \
            --title "Trillion dev build ($version)" \
            --notes "The newest build of main ($GITHUB_SHA), for the dev channel. Not a release: it can break. Install it with \`install.sh --channel dev\`, or move to it with \`trillion update --channel dev\`."
