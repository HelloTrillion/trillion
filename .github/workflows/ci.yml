name: CI

on:
  push:
    branches: [main]
  pull_request:
  # macOS runs here and on main, never on a pull request (see MAC below).
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its older run, so the older one stops holding
# runners (Mac runners are scarce). Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # gitleaks lists a pull request's commits to scan them; read-only.
  pull-requests: read

jobs:
  containment:
    name: Containment (no private data or secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Containment check covers what it claims
        run: python3 scripts/containment_check.py --selftest
      - name: No private identifiers or credentials
        run: python3 scripts/containment_check.py
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha is missing a Signed-off-by line. Use: git commit -s"
              missing=1
            fi
          done < <(git rev-list "$base..$head" --no-merges)
          exit $missing

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test must fail in minutes. Without a limit a job runs for six hours.
    # Windows needs about fifteen minutes for the suite, so the limit leaves it room.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # MAC: GitHub's Mac runners are often unavailable, and a job that waits too
        # long is cancelled without running. So macOS never blocks a pull request:
        # it runs on every push to main, nightly, and on demand.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Every directory under tests/ but tests/spine, which the Spine job runs.
      - name: Every test directory but the spine's
        run: uv run pytest tests/unit tests/integration tests/brain tests/api tests/voice tests/memory tests/mcp tests/skills tests/delivery tests/scheduler tests/storage tests/workspace tests/spend tests/helpers tests/tools tests/evals tests/importers tests/mind tests/browser
      # On macOS the spine suite runs here, not in a job of its own: one Mac runner
      # instead of two (they are scarce, and a job that waits too long is cancelled).
      - name: tests/unit + tests/spine (95% branch coverage on trillion.spine)
        if: runner.os == 'macOS'
        run: uv run pytest tests/unit tests/spine --cov=trillion.spine --cov-branch --cov-report=term-missing --cov-fail-under=95

  spine:
    name: Spine safety suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # macOS runs it inside the Python job.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: tests/unit + tests/spine (95% branch coverage on trillion.spine)
        run: uv run pytest tests/unit tests/spine --cov=trillion.spine --cov-branch --cov-report=term-missing --cov-fail-under=95

  browser:
    # Her browser (CMP-1 to CMP-9): the broker, the quarantine helper and the injection
    # fixtures, in the pinned headless Chromium, against fixture pages on loopback. The
    # Python job runs tests/browser too, without Chromium, so these skip there.
    name: Her browser (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner context isn't allowed in a job's env, so the path is set here.
      - name: Where the test Chromium lives
        run: echo "TRILLION_TEST_BROWSER=$RUNNER_TEMP/trillion-browser" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked --extra browser
      # Chromium's own sandbox stays on (decision 3). Ubuntu 24.04 keeps the user
      # namespaces it needs from unprivileged programs; this lets them be used here.
      - name: Let Chromium's sandbox start
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: The pinned Chromium, where Trillion would fetch it, and its system libraries
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$TRILLION_TEST_BROWSER/chromium" \
            uv run playwright install --with-deps --only-shell chromium
      - name: tests/browser in Chromium
        run: uv run pytest tests/browser -rs

  structure:
    name: Structural rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python3 scripts/check_agent_name.py --selftest
      - run: python3 scripts/check_agent_name.py
      - run: python3 scripts/check_raw_hex.py --selftest
      - run: python3 scripts/check_raw_hex.py
      - run: python3 scripts/check_css.py --selftest
      - run: python3 scripts/check_css.py
      - run: python3 scripts/check_plug_in.py --selftest
      - run: python3 scripts/check_plug_in.py
      - run: python3 scripts/check_one_writer.py --selftest
      - run: python3 scripts/check_one_writer.py
      - run: python3 scripts/version.py --selftest
      - name: The version is the same everywhere
        run: python3 scripts/version.py check

  js:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Package builds (exports point at dist/)
        # The desktop app builds on macOS only, in its own job.
        run: pnpm -r --if-present --filter '!@hellotrillion/desktop' run build

  desktop:
    name: Desktop (macos-latest)
    # Never on a pull request (see MAC above): on main, nightly and on demand.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    # A first Tauri build compiles a few hundred crates.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hellotrillion/desktop
        working-directory: .
      # The toolchain is pinned in src-tauri/rust-toolchain.toml; rustup installs it here.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The app builds (unsigned, not run)
        run: pnpm -C apps/desktop bundle
        working-directory: .

  galaxy-snapshots:
    # GAL-12: each orb state, dark and light, against its reference picture. Drawn in
    # software (SwiftShader), so no graphics card is needed.
    name: Galaxy snapshots
    runs-on: ubuntu-latest
    # About 7 minutes of drawing, plus the browser's system packages, which have
    # taken 10 minutes on their own when Ubuntu's mirror is slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hellotrillion/galaxy exec playwright install --with-deps chromium
      - run: pnpm --filter @hellotrillion/galaxy test:visual

  installer:
    # ONB-1: the one-line installers install a wheel with uv, put `trillion` on the
    # PATH, and can be run again. Tested with a wheel built here (without Google),
    # since PyPI has only what has been released.
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # MAC: GitHub's Mac runners are often unavailable, and a job that waits too
        # long is cancelled without running. So macOS never blocks a pull request:
        # it runs on every push to main, nightly, and on demand.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - run: pnpm install --frozen-lockfile
      # Quoted: in PowerShell, a leading @ would be read as splatting.
      - run: pnpm --filter "@hellotrillion/web..." build
      - run: uv sync --locked
      - name: Build the wheel, as a release does but without Google
        shell: bash
        run: |
          uv run python scripts/build_release.py
          # Relative, so Git Bash on Windows and PowerShell read the same path.
          wheel="$(ls ./dist-release/trillion-*.whl)"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          echo "TRILLION_TEST_WHEEL=$wheel" >> "$GITHUB_ENV"
          echo "TRILLION_TEST_VERSION=$version" >> "$GITHUB_ENV"

      - name: install.sh, with options
        if: runner.os != 'Windows'
        run: sh install.sh --wheel "$TRILLION_TEST_WHEEL" --no-setup
      - name: install.sh again, piped, with environment variables (a re-run is fine)
        if: runner.os != 'Windows'
        env:
          TRILLION_NO_SETUP: "1"
        run: TRILLION_WHEEL="$TRILLION_TEST_WHEEL" sh < install.sh
      - name: trillion --version is this version
        if: runner.os != 'Windows'
        run: |
          got="$("$(uv tool dir --bin)/trillion" --version)"
          echo "$got"
          test "$got" = "trillion $TRILLION_TEST_VERSION"
      - name: install.sh fails with a nonzero status
        if: runner.os != 'Windows'
        run: |
          if sh install.sh --version 1 --wheel x; then echo "expected a failure"; exit 1; fi
      - name: Re-running install.sh upgrades Trillion and keeps its extras
        if: runner.os != 'Windows'
        run: |
          # Stand-in wheels in a local folder, in place of PyPI: 0.0.1 with Whisper
          # added, as a user would have it, then 0.0.2 released.
          links="$RUNNER_TEMP/fake-index"
          uv run --no-sync python scripts/fake_trillion_wheels.py "$links" 0.0.1
          export UV_NO_INDEX=1 UV_FIND_LINKS="$links"
          export UV_TOOL_DIR="$RUNNER_TEMP/fake-tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/fake-bin"
          uv tool install --python 3.13 'trillion[whisper]'
          uv run --no-sync python scripts/fake_trillion_wheels.py "$links" 0.0.2
          sh install.sh --no-setup > "$RUNNER_TEMP/upgrade.log" 2>&1 || { cat "$RUNNER_TEMP/upgrade.log"; exit 1; }
          cat "$RUNNER_TEMP/upgrade.log"
          grep -F 'upgrading Trillion (keeping whisper)' "$RUNNER_TEMP/upgrade.log"
          uv tool list --show-extras | grep -F 'trillion v0.0.2 [extras: whisper]'
          # --wheel keeps them too.
          uv run --no-sync python scripts/fake_trillion_wheels.py "$RUNNER_TEMP/fake-later" 0.0.3
          sh install.sh --wheel "$RUNNER_TEMP/fake-later/trillion-0.0.3-py3-none-any.whl" --no-setup
          uv tool list --show-extras | grep -F 'trillion v0.0.3 [extras: whisper]'
      - name: install.sh follows the channel it is given, and remembers it
        if: runner.os != 'Windows'
        run: |
          # Stand-in wheels, in place of PyPI: a stable release and a newer beta. And a
          # stand-in for GitHub's answer about the dev release, naming a local wheel.
          links="$RUNNER_TEMP/channel-index"
          uv run --no-sync python scripts/fake_trillion_wheels.py "$links" 0.0.3 0.0.4b1
          uv run --no-sync python scripts/fake_trillion_wheels.py "$RUNNER_TEMP/channel-dev" 0.0.5.dev3
          printf '{"tag_name": "dev", "assets": [{"browser_download_url": "file://%s"}]}\n' \
            "$RUNNER_TEMP/channel-dev/trillion-0.0.5.dev3-py3-none-any.whl" > "$RUNNER_TEMP/dev.json"
          export UV_NO_INDEX=1 UV_FIND_LINKS="$links" TRILLION_HOME="$RUNNER_TEMP/channel-home"
          export UV_TOOL_DIR="$RUNNER_TEMP/channel-tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/channel-bin"
          export TRILLION_DEV_RELEASE="file://$RUNNER_TEMP/dev.json"
          is() { got="$("$UV_TOOL_BIN_DIR/trillion" --version)"; echo "$got"; test "$got" = "trillion $1"; }
          sh install.sh --no-setup && is 0.0.3
          test ! -e "$TRILLION_HOME/channel"
          sh install.sh --channel beta --no-setup && is 0.0.4b1
          test "$(cat "$TRILLION_HOME/channel")" = beta
          sh install.sh --no-setup && is 0.0.4b1 # remembered
          TRILLION_CHANNEL=stable sh install.sh --no-setup && is 0.0.3 # back to stable
          test "$(cat "$TRILLION_HOME/channel")" = stable
          sh install.sh --channel=dev --no-setup && is 0.0.5.dev3
          if sh install.sh --channel nightly --no-setup; then echo "expected a failure"; exit 1; fi
          if sh install.sh --channel dev --version 1 --no-setup; then echo "expected a failure"; exit 1; fi
      - name: install.sh with no uv installs uv first
        if: runner.os != 'Windows'
        run: |
          fresh="$RUNNER_TEMP/fresh-home"
          mkdir -p "$fresh"
          # An empty environment: no uv on PATH, and a home with none in it.
          if env -i PATH=/usr/bin:/bin sh -c 'command -v uv'; then echo "uv is still on PATH"; exit 1; fi
          env -i PATH=/usr/bin:/bin HOME="$fresh" sh install.sh --wheel "$PWD/$TRILLION_TEST_WHEEL" --no-setup
          test -x "$fresh/.local/bin/uv"
          got="$("$fresh/.local/bin/trillion" --version)"
          echo "$got"
          test "$got" = "trillion $TRILLION_TEST_VERSION"

      # Windows PowerShell 5.1, the one every Windows has.
      - name: install.ps1, as a file with parameters
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Wheel $env:TRILLION_TEST_WHEEL -NoSetup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: install.ps1 again, through iex, with environment variables (a re-run is fine)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TRILLION_NO_SETUP: "1"
        run: |
          $env:TRILLION_WHEEL = $env:TRILLION_TEST_WHEEL
          Get-Content -Raw install.ps1 | Invoke-Expression
          # Still here: iex must never `exit`. The next step checks this marker.
          $code = $LASTEXITCODE
          New-Item -ItemType File -Force -Path (Join-Path $env:RUNNER_TEMP 'iex-returned') | Out-Null
          if ($code -ne 0) { Write-Host "status $code"; exit 1 }
          # And nothing it defined is left in this session.
          foreach ($name in 'version', 'wheel', 'noSetup', 'status', 'trillion', 'uv', 'bindir', 'AsFile', 'extras', 'Arguments') {
            if (Test-Path "variable:$name") { Write-Host "left behind: `$$name"; exit 1 }
          }
          foreach ($name in 'Install-Trillion', 'Find-Uv', 'Invoke-Native', 'Write-Step') {
            if (Get-Command $name -ErrorAction SilentlyContinue) { Write-Host "left behind: $name"; exit 1 }
          }
      - name: install.ps1 through iex returned to its caller
        if: runner.os == 'Windows'
        shell: powershell
        run: if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'iex-returned'))) { exit 1 }
      - name: trillion --version is this version
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $got = & (Join-Path (uv tool dir --bin) 'trillion.exe') --version
          Write-Host $got
          if ($got -ne "trillion $env:TRILLION_TEST_VERSION") { exit 1 }
      - name: install.ps1 fails with a nonzero status, as a file and through iex
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Version 1 -Wheel x
          if ($LASTEXITCODE -eq 0) { Write-Host 'file: expected a failure'; exit 1 }
          $env:TRILLION_VERSION = '1'
          $env:TRILLION_WHEEL = 'x'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 1) { Write-Host "iex: expected status 1, got $LASTEXITCODE"; exit 1 }
          Write-Host 'both failed as they should, and iex returned'
          $global:LASTEXITCODE = 0
      - name: Re-running install.ps1 upgrades Trillion and keeps its extras
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          # Stand-in wheels in a local folder, in place of PyPI: 0.0.1 with Whisper
          # added, as a user would have it, then 0.0.2 released.
          $links = Join-Path $env:RUNNER_TEMP 'fake-index'
          uv run --no-sync python scripts/fake_trillion_wheels.py $links 0.0.1
          $env:UV_NO_INDEX = '1'
          $env:UV_FIND_LINKS = $links
          $env:UV_TOOL_DIR = Join-Path $env:RUNNER_TEMP 'fake-tools'
          $env:UV_TOOL_BIN_DIR = Join-Path $env:RUNNER_TEMP 'fake-bin'
          uv tool install --python 3.13 'trillion[whisper]'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          uv run --no-sync python scripts/fake_trillion_wheels.py $links 0.0.2
          $env:TRILLION_NO_SETUP = '1'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { Write-Host "status $LASTEXITCODE"; exit 1 }
          $listed = uv tool list --show-extras
          Write-Host ($listed -join "`n")
          if (-not (@($listed) -contains 'trillion v0.0.2 [extras: whisper]')) { exit 1 }
          # -Wheel keeps them too.
          $later = Join-Path $env:RUNNER_TEMP 'fake-later'
          uv run --no-sync python scripts/fake_trillion_wheels.py $later 0.0.3
          $env:TRILLION_WHEEL = Join-Path $later 'trillion-0.0.3-py3-none-any.whl'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { Write-Host "status $LASTEXITCODE"; exit 1 }
          $listed = uv tool list --show-extras
          Write-Host ($listed -join "`n")
          if (-not (@($listed) -contains 'trillion v0.0.3 [extras: whisper]')) { exit 1 }
      - name: install.ps1 as a script block takes its parameters; through iex it doesn't take its caller's
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'sb-wheels'
          uv run --no-sync python scripts/fake_trillion_wheels.py $dir 0.0.9
          $wheel = Join-Path $dir 'trillion-0.0.9-py3-none-any.whl'
          # Nothing to install from but the wheel named here: if the parameters were
          # ignored, the install fails, and setup never runs.
          $empty = Join-Path $env:RUNNER_TEMP 'empty-index'
          New-Item -ItemType Directory -Force -Path $empty | Out-Null
          $env:UV_NO_INDEX = '1'
          $env:UV_FIND_LINKS = $empty
          $env:UV_TOOL_DIR = Join-Path $env:RUNNER_TEMP 'sb-tools'
          $env:UV_TOOL_BIN_DIR = Join-Path $env:RUNNER_TEMP 'sb-bin'
          & ([scriptblock]::Create((Get-Content -Raw install.ps1))) -Wheel $wheel -NoSetup
          if ($LASTEXITCODE -ne 0) { Write-Host "script block: status $LASTEXITCODE"; exit 1 }
          $got = & (Join-Path $env:UV_TOOL_BIN_DIR 'trillion.exe') --version
          Write-Host $got
          if ($got -ne 'trillion 0.0.9') { exit 1 }
          # Through iex inside a function called with arguments of its own: those
          # are the function's, not the installer's, so the environment decides.
          function Invoke-Caller { Get-Content -Raw install.ps1 | Invoke-Expression }
          $env:TRILLION_NO_SETUP = '1'
          $env:TRILLION_WHEEL = $wheel
          Invoke-Caller -Version 1 -Wheel x
          if ($LASTEXITCODE -ne 0) { Write-Host "iex in a function: status $LASTEXITCODE"; exit 1 }
      - name: install.ps1 follows the channel it is given, and remembers it
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $links = Join-Path $env:RUNNER_TEMP 'channel-index'
          uv run --no-sync python scripts/fake_trillion_wheels.py $links 0.0.3 0.0.4b1
          $env:UV_NO_INDEX = '1'
          $env:UV_FIND_LINKS = $links
          $env:UV_TOOL_DIR = Join-Path $env:RUNNER_TEMP 'channel-tools'
          $env:UV_TOOL_BIN_DIR = Join-Path $env:RUNNER_TEMP 'channel-bin'
          $env:TRILLION_HOME = Join-Path $env:RUNNER_TEMP 'channel-home'
          $env:TRILLION_NO_SETUP = '1'
          function Test-Installed([string]$Want) {
            $got = & (Join-Path $env:UV_TOOL_BIN_DIR 'trillion.exe') --version
            Write-Host $got
            if ($got -ne "trillion $Want") { exit 1 }
          }
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Channel beta
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Test-Installed '0.0.4b1'
          if ("$(Get-Content (Join-Path $env:TRILLION_HOME 'channel'))".Trim() -ne 'beta') { exit 1 }
          Get-Content -Raw install.ps1 | Invoke-Expression # remembered
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Test-Installed '0.0.4b1'
          $env:TRILLION_CHANNEL = 'stable'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Test-Installed '0.0.3'
          $env:TRILLION_CHANNEL = 'nightly'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 1) { Write-Host 'expected a failure'; exit 1 }
          $global:LASTEXITCODE = 0
      - name: install.ps1 with no uv installs uv first
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $fresh = Join-Path $env:RUNNER_TEMP 'fresh'
          # uv goes into a folder of its own, and the runner's PATH is left alone.
          $env:UV_INSTALL_DIR = Join-Path $fresh 'uv'
          $env:UV_NO_MODIFY_PATH = '1'
          $env:UV_TOOL_DIR = Join-Path $fresh 'tools'
          $env:UV_TOOL_BIN_DIR = Join-Path $fresh 'bin'
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'uv.exe')) }) -join ';'
          if (Get-Command uv -ErrorAction SilentlyContinue) { Write-Host 'uv is still on PATH'; exit 1 }
          foreach ($dir in '.local\bin', '.cargo\bin') {
            if (Test-Path (Join-Path (Join-Path $HOME $dir) 'uv.exe')) { Write-Host "uv is already in ~\$dir"; exit 1 }
          }
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Wheel $env:TRILLION_TEST_WHEEL -NoSetup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem -Recurse -Filter uv.exe $env:UV_INSTALL_DIR)) { Write-Host 'uv was not installed'; exit 1 }
          $got = & (Join-Path $env:UV_TOOL_BIN_DIR 'trillion.exe') --version
          Write-Host $got
          if ($got -ne "trillion $env:TRILLION_TEST_VERSION") { exit 1 }

  clean-machine:
    # Phase 0's definition of done, item 1, on clean machines: the one-line installer,
    # with no uv and no Trillion beforehand and an empty home, installs uv (Astral's
    # installer) and Trillion, `trillion setup` succeeds and `trillion doctor` is green.
    # No keys, no model, no paid service: the ladder's first rung. The wheel is built
    # here (without Google), since PyPI has only what has been released.
    name: Clean machine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 is the oldest Linux the PRD supports. macOS: see MAC above.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-22.04"]') || fromJSON('["ubuntu-22.04", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # Only to build the wheel. The install below never sees this uv.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@hellotrillion/web..." build
      - run: uv sync --locked
      - name: Build the wheel, as a release does but without Google
        run: |
          uv run python scripts/build_release.py
          echo "TRILLION_TEST_WHEEL=$(ls "$PWD"/dist-release/trillion-*.whl)" >> "$GITHUB_ENV"
      - name: "A clean machine: an empty home, and no uv or trillion on the PATH"
        run: |
          clean="$RUNNER_TEMP/clean-home"
          mkdir -p "$clean"
          echo "CLEAN_HOME=$clean" >> "$GITHUB_ENV"
          # None of the runner's own PATH, which holds uv, Python and Node.
          echo "CLEAN_PATH=/usr/bin:/bin:/usr/sbin:/sbin" >> "$GITHUB_ENV"
          if env -i PATH=/usr/bin:/bin:/usr/sbin:/sbin sh -c 'command -v uv || command -v trillion'; then
            echo "::error::uv or trillion is already on the clean PATH"; exit 1
          fi
      - name: install.sh installs uv and Trillion, and trillion setup succeeds
        # `-- --no-run`: setup prepares and checks, then stops instead of serving.
        run: env -i PATH="$CLEAN_PATH" HOME="$CLEAN_HOME" sh install.sh --wheel "$TRILLION_TEST_WHEEL" -- --no-run --no-open
      - name: trillion doctor is green
        run: |
          report="$RUNNER_TEMP/doctor.txt"
          status=0
          env -i PATH="$CLEAN_PATH" HOME="$CLEAN_HOME" "$CLEAN_HOME/.local/bin/trillion" doctor > "$report" 2>&1 || status=$?
          cat "$report"
          if [ "$status" -ne 0 ] || grep -q '^fail ' "$report"; then
            echo "::error::trillion doctor has something to fix (status $status)"; exit 1
          fi
          # Green for the right reasons: the data folder, database and page are there.
          for line in 'ok +Data folder' 'ok +Database +up to date' 'ok +App page'; do
            grep -Eq "^$line" "$report" || { echo "::error::doctor did not say: $line"; exit 1; }
          done
      - name: trillion run serves the app
        run: |
          log="$RUNNER_TEMP/run.log"
          env -i PATH="$CLEAN_PATH" HOME="$CLEAN_HOME" "$CLEAN_HOME/.local/bin/trillion" run --no-open > "$log" 2>&1 &
          pid=$!
          up=""
          for _ in $(seq 1 60); do
            if curl -fs -o /dev/null http://127.0.0.1:7777/; then up=1; break; fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" || true
          if [ -z "$up" ]; then
            # The log's session token is for this throwaway run only.
            cat "$log"; echo "::error::the app did not answer on port 7777 within 60 s"; exit 1
          fi
          echo "The app answered on port 7777."

  desktop-linux:
    # SUR-3b: the desktop app builds on Linux, as the AppImage and .deb a release
    # attaches. Ubuntu 22.04, the oldest the PRD supports, so the AppImage's glibc is
    # one every supported system has. Off pull requests, as the Mac desktop job is: a
    # first Tauri build is long, and the Release workflow builds it again anyway.
    name: Desktop (ubuntu-22.04)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    env:
      # linuxdeploy is itself an AppImage; this runs it without FUSE.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The libraries Tauri builds against (WebKitGTK 4.1, GTK 3, AppIndicator)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file xdg-utils
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hellotrillion/desktop
        working-directory: .
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The AppImage and .deb build (not run)
        run: pnpm -C apps/desktop bundle:linux
        working-directory: .
      - name: The .deb names the libraries it needs
        run: |
          deb="$(ls target/release/bundle/deb/*.deb)"
          dpkg-deb --info "$deb"
          dpkg-deb --field "$deb" Depends | grep -q libwebkit2gtk-4.1
          ls -l target/release/bundle/appimage/*.AppImage

  desktop-windows:
    # SUR-3c: the desktop app builds on Windows, as the NSIS installer a release
    # attaches, and its Rust tests run there (the server's Job Object, PATH, finding
    # trillion.exe). Off pull requests, as the other desktop jobs are: a first Tauri
    # build is long, and the Release workflow builds it again anyway.
    name: Desktop (windows-latest)
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hellotrillion/desktop
        working-directory: .
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The NSIS installer builds (unsigned, not run)
        run: pnpm -C apps/desktop bundle:windows
        working-directory: .
      - name: The installer is there
        shell: bash
        run: ls -l target/release/bundle/nsis/*-setup.exe
