name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its older run, so the older one stops holding
# runners (Mac runners are scarce). Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # gitleaks lists a pull request's commits to scan them; read-only.
  pull-requests: read

jobs:
  containment:
    name: Containment (no private data or secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Containment check covers what it claims
        run: python3 scripts/containment_check.py --selftest
      - name: No private identifiers or credentials
        run: python3 scripts/containment_check.py
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha is missing a Signed-off-by line. Use: git commit -s"
              missing=1
            fi
          done < <(git rev-list "$base..$head" --no-merges)
          exit $missing

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test must fail in minutes. Without a limit a job runs for six hours.
    # Windows needs about ten minutes for the suite, so the limit leaves it room.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Every directory under tests/ but tests/spine, which the Spine job runs.
      - name: Every test directory but the spine's
        run: uv run pytest tests/unit tests/integration tests/brain tests/api tests/voice tests/memory tests/mcp tests/skills tests/delivery tests/scheduler tests/storage tests/workspace tests/evals
      # On macOS the spine suite runs here, not in a job of its own: one Mac runner
      # instead of two (they are scarce, and a job that waits too long is cancelled).
      - name: tests/unit + tests/spine (95% branch coverage on trillion.spine)
        if: runner.os == 'macOS'
        run: uv run pytest tests/unit tests/spine --cov=trillion.spine --cov-branch --cov-report=term-missing --cov-fail-under=95

  spine:
    name: Spine safety suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # macOS runs it inside the Python job.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: tests/unit + tests/spine (95% branch coverage on trillion.spine)
        run: uv run pytest tests/unit tests/spine --cov=trillion.spine --cov-branch --cov-report=term-missing --cov-fail-under=95

  structure:
    name: Structural rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python3 scripts/check_agent_name.py --selftest
      - run: python3 scripts/check_agent_name.py
      - run: python3 scripts/check_raw_hex.py --selftest
      - run: python3 scripts/check_raw_hex.py
      - run: python3 scripts/check_one_writer.py --selftest
      - run: python3 scripts/check_one_writer.py

  js:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Package builds (exports point at dist/)
        # The desktop app builds on macOS only, in its own job.
        run: pnpm -r --if-present --filter '!@hellotrillion/desktop' run build

  desktop-changed:
    # Whether a pull request touches what the desktop build depends on. Pushes to main
    # always build it.
    name: Desktop changed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git diff --name-only "$base...$head" | grep -qE '^(apps/desktop/|\.github/workflows/ci\.yml$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    name: Desktop (macos-latest)
    needs: desktop-changed
    # Skipped when nothing it builds changed: a skipped job does not fail the run.
    if: needs.desktop-changed.outputs.changed == 'true'
    runs-on: macos-latest
    # A first Tauri build compiles a few hundred crates.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hellotrillion/desktop
        working-directory: .
      # The toolchain is pinned in src-tauri/rust-toolchain.toml; rustup installs it here.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The app builds (unsigned, not run)
        run: pnpm -C apps/desktop bundle
        working-directory: .

  galaxy-snapshots:
    # GAL-12: each orb state, dark and light, against its reference picture. Drawn in
    # software (SwiftShader), so no graphics card is needed.
    name: Galaxy snapshots
    runs-on: ubuntu-latest
    # About 7 minutes of drawing, plus the browser's system packages, which have
    # taken 10 minutes on their own when Ubuntu's mirror is slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hellotrillion/galaxy exec playwright install --with-deps chromium
      - run: pnpm --filter @hellotrillion/galaxy test:visual

  installer:
    # ONB-1: the one-line installers install a wheel with uv, put `trillion` on the
    # PATH, and can be run again. Tested with a wheel built here (without Google),
    # since PyPI has only what has been released.
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck install.sh
      - run: pnpm install --frozen-lockfile
      # Quoted: in PowerShell, a leading @ would be read as splatting.
      - run: pnpm --filter "@hellotrillion/web..." build
      - run: uv sync --locked
      - name: Build the wheel, as a release does but without Google
        shell: bash
        run: |
          uv run python scripts/build_release.py
          # Relative, so Git Bash on Windows and PowerShell read the same path.
          wheel="$(ls ./dist-release/trillion-*.whl)"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -n 1)"
          echo "TRILLION_TEST_WHEEL=$wheel" >> "$GITHUB_ENV"
          echo "TRILLION_TEST_VERSION=$version" >> "$GITHUB_ENV"

      - name: install.sh, with options
        if: runner.os != 'Windows'
        run: sh install.sh --wheel "$TRILLION_TEST_WHEEL" --no-setup
      - name: install.sh again, piped, with environment variables (a re-run is fine)
        if: runner.os != 'Windows'
        env:
          TRILLION_NO_SETUP: "1"
        run: TRILLION_WHEEL="$TRILLION_TEST_WHEEL" sh < install.sh
      - name: trillion --version is this version
        if: runner.os != 'Windows'
        run: |
          got="$("$(uv tool dir --bin)/trillion" --version)"
          echo "$got"
          test "$got" = "trillion $TRILLION_TEST_VERSION"
      - name: install.sh fails with a nonzero status
        if: runner.os != 'Windows'
        run: |
          if sh install.sh --version 1 --wheel x; then echo "expected a failure"; exit 1; fi
      - name: Re-running install.sh upgrades Trillion and keeps its extras
        if: runner.os != 'Windows'
        run: |
          # Stand-in wheels in a local folder, in place of PyPI: 0.0.1 with Whisper
          # added, as a user would have it, then 0.0.2 released.
          links="$RUNNER_TEMP/fake-index"
          uv run --no-sync python scripts/fake_trillion_wheels.py "$links" 0.0.1
          export UV_NO_INDEX=1 UV_FIND_LINKS="$links"
          export UV_TOOL_DIR="$RUNNER_TEMP/fake-tools" UV_TOOL_BIN_DIR="$RUNNER_TEMP/fake-bin"
          uv tool install --python 3.13 'trillion[whisper]'
          uv run --no-sync python scripts/fake_trillion_wheels.py "$links" 0.0.2
          sh install.sh --no-setup > "$RUNNER_TEMP/upgrade.log" 2>&1 || { cat "$RUNNER_TEMP/upgrade.log"; exit 1; }
          cat "$RUNNER_TEMP/upgrade.log"
          grep -F 'upgrading Trillion (keeping whisper)' "$RUNNER_TEMP/upgrade.log"
          uv tool list --show-extras | grep -F 'trillion v0.0.2 [extras: whisper]'
          # --wheel keeps them too.
          uv run --no-sync python scripts/fake_trillion_wheels.py "$RUNNER_TEMP/fake-later" 0.0.3
          sh install.sh --wheel "$RUNNER_TEMP/fake-later/trillion-0.0.3-py3-none-any.whl" --no-setup
          uv tool list --show-extras | grep -F 'trillion v0.0.3 [extras: whisper]'
      - name: install.sh with no uv installs uv first
        if: runner.os != 'Windows'
        run: |
          fresh="$RUNNER_TEMP/fresh-home"
          mkdir -p "$fresh"
          # An empty environment: no uv on PATH, and a home with none in it.
          if env -i PATH=/usr/bin:/bin sh -c 'command -v uv'; then echo "uv is still on PATH"; exit 1; fi
          env -i PATH=/usr/bin:/bin HOME="$fresh" sh install.sh --wheel "$PWD/$TRILLION_TEST_WHEEL" --no-setup
          test -x "$fresh/.local/bin/uv"
          got="$("$fresh/.local/bin/trillion" --version)"
          echo "$got"
          test "$got" = "trillion $TRILLION_TEST_VERSION"

      # Windows PowerShell 5.1, the one every Windows has.
      - name: install.ps1, as a file with parameters
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Wheel $env:TRILLION_TEST_WHEEL -NoSetup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: install.ps1 again, through iex, with environment variables (a re-run is fine)
        if: runner.os == 'Windows'
        shell: powershell
        env:
          TRILLION_NO_SETUP: "1"
        run: |
          $env:TRILLION_WHEEL = $env:TRILLION_TEST_WHEEL
          Get-Content -Raw install.ps1 | Invoke-Expression
          # Still here: iex must never `exit`. The next step checks this marker.
          $code = $LASTEXITCODE
          New-Item -ItemType File -Force -Path (Join-Path $env:RUNNER_TEMP 'iex-returned') | Out-Null
          if ($code -ne 0) { Write-Host "status $code"; exit 1 }
          # And nothing it defined is left in this session.
          foreach ($name in 'version', 'wheel', 'noSetup', 'status', 'trillion', 'uv', 'bindir', 'AsFile', 'extras', 'Arguments') {
            if (Test-Path "variable:$name") { Write-Host "left behind: `$$name"; exit 1 }
          }
          foreach ($name in 'Install-Trillion', 'Find-Uv', 'Invoke-Native', 'Write-Step') {
            if (Get-Command $name -ErrorAction SilentlyContinue) { Write-Host "left behind: $name"; exit 1 }
          }
      - name: install.ps1 through iex returned to its caller
        if: runner.os == 'Windows'
        shell: powershell
        run: if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'iex-returned'))) { exit 1 }
      - name: trillion --version is this version
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $got = & (Join-Path (uv tool dir --bin) 'trillion.exe') --version
          Write-Host $got
          if ($got -ne "trillion $env:TRILLION_TEST_VERSION") { exit 1 }
      - name: install.ps1 fails with a nonzero status, as a file and through iex
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Version 1 -Wheel x
          if ($LASTEXITCODE -eq 0) { Write-Host 'file: expected a failure'; exit 1 }
          $env:TRILLION_VERSION = '1'
          $env:TRILLION_WHEEL = 'x'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 1) { Write-Host "iex: expected status 1, got $LASTEXITCODE"; exit 1 }
          Write-Host 'both failed as they should, and iex returned'
          $global:LASTEXITCODE = 0
      - name: Re-running install.ps1 upgrades Trillion and keeps its extras
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          # Stand-in wheels in a local folder, in place of PyPI: 0.0.1 with Whisper
          # added, as a user would have it, then 0.0.2 released.
          $links = Join-Path $env:RUNNER_TEMP 'fake-index'
          uv run --no-sync python scripts/fake_trillion_wheels.py $links 0.0.1
          $env:UV_NO_INDEX = '1'
          $env:UV_FIND_LINKS = $links
          $env:UV_TOOL_DIR = Join-Path $env:RUNNER_TEMP 'fake-tools'
          $env:UV_TOOL_BIN_DIR = Join-Path $env:RUNNER_TEMP 'fake-bin'
          uv tool install --python 3.13 'trillion[whisper]'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          uv run --no-sync python scripts/fake_trillion_wheels.py $links 0.0.2
          $env:TRILLION_NO_SETUP = '1'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { Write-Host "status $LASTEXITCODE"; exit 1 }
          $listed = uv tool list --show-extras
          Write-Host ($listed -join "`n")
          if (-not (@($listed) -contains 'trillion v0.0.2 [extras: whisper]')) { exit 1 }
          # -Wheel keeps them too.
          $later = Join-Path $env:RUNNER_TEMP 'fake-later'
          uv run --no-sync python scripts/fake_trillion_wheels.py $later 0.0.3
          $env:TRILLION_WHEEL = Join-Path $later 'trillion-0.0.3-py3-none-any.whl'
          Get-Content -Raw install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 0) { Write-Host "status $LASTEXITCODE"; exit 1 }
          $listed = uv tool list --show-extras
          Write-Host ($listed -join "`n")
          if (-not (@($listed) -contains 'trillion v0.0.3 [extras: whisper]')) { exit 1 }
      - name: install.ps1 as a script block takes its parameters; through iex it doesn't take its caller's
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $dir = Join-Path $env:RUNNER_TEMP 'sb-wheels'
          uv run --no-sync python scripts/fake_trillion_wheels.py $dir 0.0.9
          $wheel = Join-Path $dir 'trillion-0.0.9-py3-none-any.whl'
          # Nothing to install from but the wheel named here: if the parameters were
          # ignored, the install fails, and setup never runs.
          $empty = Join-Path $env:RUNNER_TEMP 'empty-index'
          New-Item -ItemType Directory -Force -Path $empty | Out-Null
          $env:UV_NO_INDEX = '1'
          $env:UV_FIND_LINKS = $empty
          $env:UV_TOOL_DIR = Join-Path $env:RUNNER_TEMP 'sb-tools'
          $env:UV_TOOL_BIN_DIR = Join-Path $env:RUNNER_TEMP 'sb-bin'
          & ([scriptblock]::Create((Get-Content -Raw install.ps1))) -Wheel $wheel -NoSetup
          if ($LASTEXITCODE -ne 0) { Write-Host "script block: status $LASTEXITCODE"; exit 1 }
          $got = & (Join-Path $env:UV_TOOL_BIN_DIR 'trillion.exe') --version
          Write-Host $got
          if ($got -ne 'trillion 0.0.9') { exit 1 }
          # Through iex inside a function called with arguments of its own: those
          # are the function's, not the installer's, so the environment decides.
          function Invoke-Caller { Get-Content -Raw install.ps1 | Invoke-Expression }
          $env:TRILLION_NO_SETUP = '1'
          $env:TRILLION_WHEEL = $wheel
          Invoke-Caller -Version 1 -Wheel x
          if ($LASTEXITCODE -ne 0) { Write-Host "iex in a function: status $LASTEXITCODE"; exit 1 }
      - name: install.ps1 with no uv installs uv first
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $fresh = Join-Path $env:RUNNER_TEMP 'fresh'
          # uv goes into a folder of its own, and the runner's PATH is left alone.
          $env:UV_INSTALL_DIR = Join-Path $fresh 'uv'
          $env:UV_NO_MODIFY_PATH = '1'
          $env:UV_TOOL_DIR = Join-Path $fresh 'tools'
          $env:UV_TOOL_BIN_DIR = Join-Path $fresh 'bin'
          $env:Path = (($env:Path -split ';') | Where-Object { $_ -and -not (Test-Path -LiteralPath (Join-Path $_ 'uv.exe')) }) -join ';'
          if (Get-Command uv -ErrorAction SilentlyContinue) { Write-Host 'uv is still on PATH'; exit 1 }
          foreach ($dir in '.local\bin', '.cargo\bin') {
            if (Test-Path (Join-Path (Join-Path $HOME $dir) 'uv.exe')) { Write-Host "uv is already in ~\$dir"; exit 1 }
          }
          powershell -ExecutionPolicy Bypass -File .\install.ps1 -Wheel $env:TRILLION_TEST_WHEEL -NoSetup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-ChildItem -Recurse -Filter uv.exe $env:UV_INSTALL_DIR)) { Write-Host 'uv was not installed'; exit 1 }
          $got = & (Join-Path $env:UV_TOOL_BIN_DIR 'trillion.exe') --version
          Write-Host $got
          if ($got -ne "trillion $env:TRILLION_TEST_VERSION") { exit 1 }
