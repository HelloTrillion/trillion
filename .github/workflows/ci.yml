name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks lists a pull request's commits to scan them; read-only.
  pull-requests: read

jobs:
  containment:
    name: Containment (no private data or secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Containment check covers what it claims
        run: python3 scripts/containment_check.py --selftest
      - name: No private identifiers or credentials
        run: python3 scripts/containment_check.py
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha is missing a Signed-off-by line. Use: git commit -s"
              missing=1
            fi
          done < <(git rev-list "$base..$head" --no-merges)
          exit $missing

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung test must fail in minutes. Without a limit a job runs for six hours.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      # Every directory under tests/ but tests/spine, which the Spine job runs.
      - name: Every test directory but the spine's
        run: uv run pytest tests/unit tests/integration tests/brain tests/api tests/voice tests/memory tests/mcp tests/skills tests/delivery tests/scheduler tests/storage tests/workspace

  spine:
    name: Spine safety suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: tests/unit + tests/spine (95% branch coverage on trillion.spine)
        run: uv run pytest tests/unit tests/spine --cov=trillion.spine --cov-branch --cov-report=term-missing --cov-fail-under=95

  structure:
    name: Structural rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python3 scripts/check_agent_name.py --selftest
      - run: python3 scripts/check_agent_name.py
      - run: python3 scripts/check_raw_hex.py --selftest
      - run: python3 scripts/check_raw_hex.py
      - run: python3 scripts/check_one_writer.py --selftest
      - run: python3 scripts/check_one_writer.py

  js:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Package builds (exports point at dist/)
        # The desktop app builds on macOS only, in its own job.
        run: pnpm -r --if-present --filter '!@hellotrillion/desktop' run build

  desktop:
    name: Desktop (macos-latest)
    runs-on: macos-latest
    # A first Tauri build compiles a few hundred crates.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @hellotrillion/desktop
        working-directory: .
      # The toolchain is pinned in src-tauri/rust-toolchain.toml; rustup installs it here.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: The app builds (unsigned, not run)
        run: pnpm -C apps/desktop bundle
        working-directory: .

  galaxy-snapshots:
    # GAL-12: each orb state, dark and light, against its reference picture. Drawn in
    # software (SwiftShader), so no graphics card is needed.
    name: Galaxy snapshots
    runs-on: ubuntu-latest
    # About 7 minutes of drawing, plus the browser's system packages, which have
    # taken 10 minutes on their own when Ubuntu's mirror is slow.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hellotrillion/galaxy exec playwright install --with-deps chromium
      - run: pnpm --filter @hellotrillion/galaxy test:visual
