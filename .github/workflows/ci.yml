name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # gitleaks lists a pull request's commits to scan them; read-only.
  pull-requests: read

jobs:
  containment:
    name: Containment (no private data or secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Containment check covers what it claims
        run: python3 scripts/containment_check.py --selftest
      - name: No private identifiers or credentials
        run: python3 scripts/containment_check.py
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $sha is missing a Signed-off-by line. Use: git commit -s"
              missing=1
            fi
          done < <(git rev-list "$base..$head" --no-merges)
          exit $missing

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Unit and integration tests
        run: uv run pytest tests/unit tests/integration

  spine:
    name: Spine safety suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: tests/spine (protected; 95% branch coverage on trillion.spine)
        run: |
          if find tests/spine -name 'test_*.py' | grep -q .; then
            uv run pytest tests/spine --cov=trillion.spine --cov-branch --cov-fail-under=95
          else
            echo "No spine tests yet."
          fi

  structure:
    name: Structural rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/check_agent_name.py --selftest
      - run: python3 scripts/check_agent_name.py
      - run: python3 scripts/check_raw_hex.py --selftest
      - run: python3 scripts/check_raw_hex.py

  js:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Package builds (exports point at dist/)
        run: pnpm -r --if-present run build
