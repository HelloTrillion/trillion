[package]
name = "trillion-desktop"
version = "0.0.1"
description = "Trillion as a Mac app"
license = "Apache-2.0"
edition = "2021"
publish = false

[lib]
name = "trillion_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
libc = "0.2"
hmac = "0.12"
sha2 = "0.10"
signal-hook = "0.4.5"
url = "2"
# The system folder picker, used directly rather than through tauri-plugin-dialog:
# the plugin injects a script into every page that replaces window.alert and
# window.confirm, and the server's page must not get its API. Same crate and
# features the plugin uses.
rfd = { version = "0.17.2", default-features = false, features = ["gtk3", "common-controls-v6"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Matches the version tauri and wry use, for webkit.rs.
objc2 = "0.6.5"
