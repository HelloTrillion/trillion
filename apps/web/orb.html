<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trillion</title>
    <style>
      /* A see-through window: only the orb and its caption show. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: var(--font-ui);
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .float {
        all: unset;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }
      .float-orb {
        flex: none;
        width: 52px;
        height: 52px;
        border-radius: var(--radius-full);
        background: radial-gradient(circle at 50% 50%, var(--color-accent) 0%, transparent 70%),
          radial-gradient(circle at 62% 38%, var(--mind-memory) 0%, transparent 55%);
        box-shadow: 0 0 24px var(--color-accent);
        animation: breathe 3.2s ease-in-out infinite;
        transition: filter var(--motion-base);
      }
      [data-state='listening'] .float-orb {
        animation-duration: 1.2s;
      }
      [data-state='thinking'] .float-orb {
        background: radial-gradient(circle at 50% 50%, var(--mind-working) 0%, transparent 70%),
          radial-gradient(circle at 62% 38%, var(--mind-knowledge) 0%, transparent 55%);
        box-shadow: 0 0 24px var(--mind-working);
        animation-duration: 0.9s;
      }
      [data-state='speaking'] .float-orb {
        animation-duration: 0.6s;
      }
      [data-state='idle'] .float-orb {
        animation: none;
        opacity: 0.7;
      }
      /* The pill around the caption. */
      .float-caption {
        max-width: 100%;
        padding: 4px 10px;
        border-radius: var(--radius-md);
        background: var(--color-surface-glass);
        border: 1px solid var(--color-border);
        color: var(--color-text-0);
        font-size: 12px;
        line-height: 1.35;
        text-align: center;
      }
      .float-caption[hidden] {
        display: none;
      }
      /* Two lines, the newest at the bottom: older words go out of sight at the top. */
      .float-lines {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        max-height: 2.7em;
        overflow: hidden;
      }
      @keyframes breathe {
        0%,
        100% {
          transform: scale(0.9);
        }
        50% {
          transform: scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .float-orb {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <button type="button" class="float" id="float" aria-label="Open Trillion"></button>
    <script type="module" src="./src/orb.ts"></script>
  </body>
</html>
