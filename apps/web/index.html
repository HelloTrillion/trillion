<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trillion</title>
  </head>
  <body>
    <canvas id="galaxy" aria-hidden="true"></canvas>
    <header class="top">
      <div class="brand">
        <strong>Trillion</strong>
        <span class="status" id="status" role="status" aria-live="polite">Connecting</span>
      </div>
      <div class="top-right">
        <button type="button" class="model" id="new" hidden>New conversation</button>
        <button type="button" class="model" id="names" hidden>Names</button>
        <button type="button" class="model" id="listening" aria-haspopup="dialog" hidden></button>
        <button type="button" class="model" id="speech" aria-haspopup="dialog" hidden></button>
        <button type="button" class="model" id="model" aria-haspopup="dialog" hidden></button>
        <div class="theme-switch" role="radiogroup" aria-label="Theme">
          <button type="button" role="radio" data-theme-choice="dark" aria-checked="true">Dark</button>
          <button type="button" role="radio" data-theme-choice="light" aria-checked="false">Light</button>
        </div>
      </div>
    </header>
    <main class="stage">
      <div class="banner" id="banner" role="alert" hidden></div>
      <section class="transcript" id="transcript" role="log" aria-label="Conversation" aria-live="polite" tabindex="0"></section>
      <div class="choices" id="choices" role="group" aria-label="Quick replies" hidden></div>
      <form class="ask" id="ask">
        <label class="visually-hidden" for="input">Message</label>
        <textarea id="input" rows="1" placeholder="Say something" autocomplete="off" disabled></textarea>
        <button type="button" id="mic" aria-pressed="false" hidden>Speak</button>
        <button type="submit" id="send" disabled>Send</button>
        <button type="button" id="stop" hidden>Stop</button>
      </form>
      <p class="foot" id="foot"></p>
    </main>
    <dialog id="settings"></dialog>
    <dialog id="speech-settings"></dialog>
    <dialog id="listening-settings"></dialog>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
